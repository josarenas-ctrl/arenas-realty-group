<!DOCTYPE html>
<!-- ari v2 -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ARI — Oportunidades para Asesores</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --texto: #1a1a2e;
    --texto-suave: #6b7280;
    --borde: #e5e7eb;
    --verde: #16a34a;
    --verde-bg: #dcfce7;
    --amarillo: #b45309;
    --amarillo-bg: #fef3c7;
    --rojo: #dc2626;
    --rojo-bg: #fee2e2;
    --gris: #6b7280;
    --gris-bg: #f3f4f6;
    --acento: #1e3a5f;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--acento);
    color: #fff;
    padding: env(safe-area-inset-top, 0px) 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 12px 0 2px;
  }
  header p {
    margin: 0;
    font-size: 13px;
    opacity: 0.8;
  }
  .filtros {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid var(--borde);
  }
  #filtros-semaforo {
    position: sticky;
    top: 68px;
    z-index: 9;
  }
  .chip {
    flex: none;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--borde);
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.activo {
    background: var(--acento);
    color: #fff;
    border-color: var(--acento);
  }
  main {
    padding: 12px 16px 32px;
    max-width: 720px;
    margin: 0 auto;
  }
  .resumen {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .resumen span {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--gris-bg);
    color: var(--texto-suave);
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--borde);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.verde { background: var(--verde-bg); color: var(--verde); }
  .badge.amarillo { background: var(--amarillo-bg); color: var(--amarillo); }
  .badge.rojo { background: var(--rojo-bg); color: var(--rojo); }
  .badge.sin_datos_suficientes { background: var(--gris-bg); color: var(--gris); }
  .card h3 {
    font-size: 15px;
    margin: 8px 0 4px;
    line-height: 1.3;
  }
  .precio {
    font-size: 17px;
    font-weight: 700;
    color: var(--acento);
  }
  .detalle {
    font-size: 13px;
    color: var(--texto-suave);
    margin-top: 4px;
  }
  .m2 {
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 6px;
  }
  .m2 strong { color: var(--texto); }
  .dup {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    background: #eef2ff;
    color: #4338ca;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .acciones {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .acciones a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    padding: 8px;
    border-radius: 8px;
    background: var(--acento);
    color: #fff;
  }
  .vacio, .cargando {
    text-align: center;
    color: var(--texto-suave);
    padding: 40px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>ARI — Oportunidades</h1>
  <p id="subtitulo">Cargando...</p>
</header>

<div class="filtros" id="filtros-semaforo">
  <button class="chip activo" data-filtro="todos">Todas</button>
  <button class="chip" data-filtro="verde">🟢 Gangas</button>
  <button class="chip" data-filtro="amarillo">🟡 Precio normal</button>
  <button class="chip" data-filtro="rojo">🔴 Sobrevaloradas</button>
</div>

<div class="filtros" id="filtros-estado"></div>

<div class="filtros" id="filtros-operacion"></div>

<div class="filtros" id="filtros-tipo"></div>

<div class="filtros" id="filtros-zona"></div>

<main>
  <div class="resumen" id="resumen"></div>
  <div id="lista" class="cargando">Cargando propiedades...</div>
</main>

<script>
  const RUTA_DATOS = "../data/ultimo-analisis.json";
  let fichasOriginal = [];
    let filtroSemaforo = "todos";
    let filtroEstado = "todos";
    let filtroOperacion = "todos";
    let filtroTipo = "todos";
    let filtroZona = "todos";

  const NOMBRES_SEMAFORO = {
    verde: "🟢 Ganga",
    amarillo: "🟡 Precio de mercado",
    rojo: "🔴 Sobrevalorada",
    sin_datos_suficientes: "⚪ Sin datos suficientes",
  };

  function formatoUSD(numero) {
      if (numero === null || numero === undefined) return "—";
      return "USD " + numero.toLocaleString("es-VE");
    }

    function extraerEstado(ubicacion) {
      if (!ubicacion || !ubicacion.includes(",")) return null;
      return ubicacion.split(",").pop().trim();
    }

    function extraerOperacion(titulo) {
      if (!titulo) return null;
      if (/alquiler/i.test(titulo)) return "Alquiler";
      if (/venta/i.test(titulo)) return "Venta";
      return null;
    }

    function renderChipsEstado(fichas) {
      const estados = [...new Set(fichas.map(f => extraerEstado(f.ubicacion)).filter(Boolean))].sort();
      const contenedor = document.getElementById("filtros-estado");
      contenedor.innerHTML = "";
      if (estados.length <= 1) { contenedor.style.display = "none"; return; }
      contenedor.style.display = "flex";
      const chipTodos = document.createElement("button");
      chipTodos.className = "chip activo";
      chipTodos.textContent = "Todos los estados";
      chipTodos.onclick = () => { filtroEstado = "todos"; actualizarChips(contenedor, filtroEstado, "Todos los estados"); render(); };
      contenedor.appendChild(chipTodos);
      estados.forEach(e => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = e;
        chip.onclick = () => { filtroEstado = e; actualizarChips(contenedor, filtroEstado, "Todos los estados"); render(); };
        contenedor.appendChild(chip);
      });
    }

    function renderChipsOperacion(fichas) {
      const ops = [...new Set(fichas.map(f => extraerOperacion(f.titulo)).filter(Boolean))].sort();
      const contenedor = document.getElementById("filtros-operacion");
      contenedor.innerHTML = "";
      if (ops.length <= 1) { contenedor.style.display = "none"; return; }
      contenedor.style.display = "flex";
      const chipTodos = document.createElement("button");
      chipTodos.className = "chip activo";
      chipTodos.textContent = "Venta y alquiler";
      chipTodos.onclick = () => { filtroOperacion = "todos"; actualizarChips(contenedor, filtroOperacion, "Venta y alquiler"); render(); };
      contenedor.appendChild(chipTodos);
      ops.forEach(op => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = op;
        chip.onclick = () => { filtroOperacion = op; actualizarChips(contenedor, filtroOperacion, "Venta y alquiler"); render(); };
        contenedor.appendChild(chip);
      });
    }

  function renderChipsTipo(fichas) {
    const tipos = [...new Set(fichas.map((f) => f.tipo).filter(Boolean))].sort();
    const contenedor = document.getElementById("filtros-tipo");
    contenedor.innerHTML = "";
    const chipTodos = document.createElement("button");
    chipTodos.className = "chip activo";
    chipTodos.textContent = "Todos los tipos";
    chipTodos.onclick = () => { filtroTipo = "todos"; actualizarChips(contenedor, filtroTipo, "Todos los tipos"); render(); };
    contenedor.appendChild(chipTodos);

    tipos.forEach((tipo) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = tipo;
      chip.onclick = () => { filtroTipo = tipo; actualizarChips(contenedor, filtroTipo, "Todos los tipos"); render(); };
      contenedor.appendChild(chip);
    });
  }

  function renderChipsZona(fichas) {
    // El "área" se toma directo de la ubicación ya extraída de cada anuncio
    // (ej. "San Antonio de Los Altos, Miranda") — cuando se agreguen más
    // zonas al scraper, estos chips aparecen solos, sin tocar este código.
    const zonas = [...new Set(fichas.map((f) => f.ubicacion).filter(Boolean))].sort();
    const contenedor = document.getElementById("filtros-zona");
    contenedor.innerHTML = "";

    if (zonas.length <= 1) {
      // Con una sola zona todavía no tiene sentido mostrar el filtro.
      contenedor.style.display = "none";
      return;
    }
    contenedor.style.display = "flex";

    const chipTodos = document.createElement("button");
    chipTodos.className = "chip activo";
    chipTodos.textContent = "Todas las áreas";
    chipTodos.onclick = () => { filtroZona = "todos"; actualizarChips(contenedor, filtroZona, "Todas las áreas"); render(); };
    contenedor.appendChild(chipTodos);

    zonas.forEach((zona) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = zona;
      chip.onclick = () => { filtroZona = zona; actualizarChips(contenedor, filtroZona, "Todas las áreas"); render(); };
      contenedor.appendChild(chip);
    });
  }

  function actualizarChips(contenedor, valorActivo, textoTodos) {
    [...contenedor.children].forEach((c) => c.classList.remove("activo"));
    const activo = [...contenedor.children].find(
      (c) => c.textContent === (valorActivo === "todos" ? textoTodos : valorActivo)
    );
    if (activo) activo.classList.add("activo");
  }

  function render() {
    const lista = document.getElementById("lista");
    let fichas = fichasOriginal;

    if (filtroSemaforo !== "todos") fichas = fichas.filter(f => f.semaforo === filtroSemaforo);
        if (filtroEstado !== "todos") fichas = fichas.filter(f => extraerEstado(f.ubicacion) === filtroEstado);
        if (filtroOperacion !== "todos") fichas = fichas.filter(f => extraerOperacion(f.titulo) === filtroOperacion);
        if (filtroTipo !== "todos") fichas = fichas.filter(f => f.tipo === filtroTipo);
        if (filtroZona !== "todos") fichas = fichas.filter(f => f.ubicacion === filtroZona);

    if (fichas.length === 0) {
      lista.className = "vacio";
      lista.textContent = "No hay propiedades con estos filtros.";
      return;
    }

    lista.className = "";
    lista.innerHTML = fichas
      .map((f) => {
        const specs = [
          f.habitaciones ? `${f.habitaciones} hab` : null,
          f.banos ? `${f.banos} baños` : null,
          f.metros_cuadrados ? `${f.metros_cuadrados} m²` : null,
        ]
          .filter(Boolean)
          .join(" · ");

        const m2linea =
          f.precio_m2 && f.promedio_m2_tipo_zona
            ? `<div class="m2">USD <strong>${f.precio_m2}</strong>/m² — promedio de ${f.tipo?.toLowerCase() || "la zona"}: USD ${f.promedio_m2_tipo_zona}/m² (${f.diferencia_vs_promedio_pct > 0 ? "+" : ""}${f.diferencia_vs_promedio_pct}%)</div>`
            : "";

        const dupLinea =
          f.total_publicaciones_encontradas > 1
            ? `<span class="dup">Publicada ${f.total_publicaciones_encontradas} veces</span>`
            : "";

        return `
          <div class="card">
            <div class="card-top">
              <span class="badge ${f.semaforo}">${NOMBRES_SEMAFORO[f.semaforo] || f.semaforo}</span>
            </div>
            <h3>${f.titulo}</h3>
            <div class="precio">${formatoUSD(parseInt(String(f.precio_texto || "").replace(/[^\d]/g, ""), 10) || null)}</div>
            <div class="detalle">${specs || "Sin specs detalladas"} · ${f.ubicacion || ""}</div>
            ${m2linea}
            ${dupLinea}
            <div class="acciones">
              <a href="${f.enlace_principal}" target="_blank" rel="noopener">Ver publicación</a>
            </div>
          </div>
        `;
      })
      .join("");
  }

  function renderResumen(resumen) {
    const contenedor = document.getElementById("resumen");
    contenedor.innerHTML = `
      <span>🟢 ${resumen.verde || 0} gangas</span>
      <span>🟡 ${resumen.amarillo || 0} normales</span>
      <span>🔴 ${resumen.rojo || 0} sobrevaloradas</span>
      <span>⚪ ${resumen.sin_datos_suficientes || 0} sin datos</span>
    `;
  }

  document.querySelectorAll("#filtros-semaforo .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      filtroSemaforo = chip.dataset.filtro;
      document.querySelectorAll("#filtros-semaforo .chip").forEach((c) => c.classList.remove("activo"));
      chip.classList.add("activo");
      render();
    });
  });

  fetch(RUTA_DATOS)
    .then((r) => {
      if (!r.ok) throw new Error("No se pudo cargar el archivo de datos");
      return r.json();
    })
    .then((data) => {
      fichasOriginal = data.fichas || [];
      document.getElementById("subtitulo").textContent =
        "Actualizado: " + new Date(data.generado_en).toLocaleString("es-VE");
      renderResumen(data.resumen || {});
      renderChipsEstado(fichasOriginal);
      renderChipsOperacion(fichasOriginal);
      renderChipsTipo(fichasOriginal);
      renderChipsZona(fichasOriginal);
      render();
    })
    .catch((err) => {
      document.getElementById("subtitulo").textContent = "Error al cargar datos";
      document.getElementById("lista").className = "vacio";
      document.getElementById("lista").textContent =
        "No se pudo cargar el análisis. Verifica que exista ari/data/ultimo-analisis.json";
      console.error(err);
    });
</script>

</body>
</html>
