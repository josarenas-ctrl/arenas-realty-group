backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "propiedades"
    label: "Propiedades"
    folder: "propiedades"
    create: true
    slug: "{{slug}}"
    format: "json"
    label_singular: "Propiedad"
    summary: "{{titulo}} — {{operacion}} — {{precio}}"
    fields:
      - { label: "Título de la propiedad", name: "titulo", widget: "string" }
      - label: "Operación"
        name: "operacion"
        widget: "select"
        options: ["Venta", "Alquiler"]
      - label: "Tipo de propiedad"
        name: "tipo"
        widget: "select"
        options: ["Casa", "Apartamento", "Local", "Terreno"]
      - { label: "Precio", name: "precio", widget: "string" }
      - { label: "Ubicación", name: "ubicacion", widget: "string" }
      - { label: "Metraje (m2)", name: "metraje", widget: "string", required: false }
      - { label: "Habitaciones", name: "habitaciones", widget: "string", required: false }
      - { label: "Baños", name: "banos", widget: "string", required: false }
      - { label: "Estacionamientos", name: "estacionamientos", widget: "string", required: false }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Fotos", name: "fotos", widget: "image", multiple: true, required: false }
      - { label: "Nombre del asesor", name: "asesor", widget: "string" }
      - { label: "WhatsApp del asesor", name: "whatsapp_asesor", widget: "string" }
      - { label: "Publicada", name: "publicada", widget: "boolean", default: true }
