site_url: https://www.arenasrealtygroup.com
display_url: https://www.arenasrealtygroup.com

backend:
  name: github
  repo: josarenas-ctrl/arenas-realty-group
  branch: cloudflare-test
  base_url: https://arenas-auth.arenasrealtygroup1.workers.dev
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "propiedades"
    label: "Propiedades"
    folder: "propiedades"
    create: true
    slug: "{{titulo}}"
    identifier_field: "titulo"
    format: "json"
    label_singular: "Propiedad"
    summary: "{{titulo}} — {{operacion}} — {{precio}}"
    fields:
      - { label: "Título de la propiedad", name: "titulo", widget: "string" }
      - label: "Operación"
        name: "operacion"
        widget: "select"
        options: ["Venta", "Alquiler"]
      - label: "Tipo de propiedad"
        name: "tipo"
        widget: "select"
        options: ["Casa", "Apartamento", "Local", "Terreno"]
      - { label: "Precio", name: "precio", widget: "string" }
      - { label: "Ubicación", name: "ubicacion", widget: "string" }
      - { label: "Link de Google Maps (opcional si usas el mapa de abajo)", name: "mapa_url", widget: "string", required: false, hint: "Puedes pegar aquí el link de Google Maps, o usar el mapa interactivo de abajo para marcar la ubicación." }
      - label: "Ubicación en el mapa"
        name: "ubicacion_mapa"
        widget: "map"
        required: false
        hint: "Busca la dirección o haz clic en el mapa para marcar la ubicación exacta de la propiedad."
      - { label: "Área de terreno (m2)", name: "area_terreno", widget: "string", required: false }
      - { label: "Área de construcción (m2)", name: "area_construccion", widget: "string", required: false }
      - { label: "Habitaciones", name: "habitaciones", widget: "string", required: false }
      - { label: "Baños", name: "banos", widget: "string", required: false }
      - { label: "Estacionamientos", name: "estacionamientos", widget: "string", required: false }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Características (una por línea)", name: "caracteristicas", widget: "text", required: false, hint: "Ej: Jardín, Cocina tipo americano, Área social, Seguridad 24h — una en cada línea." }
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        field: { label: "Imagen", name: "foto", widget: "image" }
      - { label: "Link de video (YouTube, Instagram, TikTok, etc.)", name: "video_url", widget: "string", required: false, hint: "Pega el link del video, no subas el archivo directamente." }
      - { label: "Nombre del asesor", name: "asesor", widget: "string" }
      - { label: "WhatsApp del asesor", name: "whatsapp_asesor", widget: "string" }
      - { label: "Publicada", name: "publicada", widget: "boolean", default: true }
