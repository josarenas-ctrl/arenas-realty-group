<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de administración - Arenas Realty Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --clay: #0B2A4A;
    --clay-soft: #3D6690;
    --terracotta: #D9A438;
    --cream: #FBF9F4;
  }
  #admin-tools{
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 9999;
    display: flex;
    gap: 8px;
    font-family: 'Work Sans', sans-serif;
  }
  #admin-tools a{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 24px;
    box-shadow: 0 3px 10px rgba(11,42,74,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    white-space: nowrap;
  }
  #admin-tools a:hover{
    transform: translateY(-2px);
    box-shadow: 0 5px 14px rgba(11,42,74,0.32);
  }
  .tool-back{
    background: var(--cream);
    color: var(--clay);
    border: 1px solid rgba(11,42,74,0.15);
  }
  .tool-invite{
    background: var(--clay);
    color: var(--cream);
  }
  .tool-invite span.dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--terracotta);
    display: inline-block;
  }
  @media (max-width: 480px){
    #admin-tools a{ font-size: 0.76rem; padding: 8px 13px; }
  }
</style>
</head>
<body>
  <!-- Cargando Sveltia CMS -->
  <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  
  <div id="admin-tools">
    <a class="tool-back" href="https://www.arenasrealtygroup.com" target="_blank" rel="noopener">← Volver al sitio</a>
    <a class="tool-invite" href="https://arenas-auth.arenasrealtygroup1.workers.dev/invitar" target="_blank" rel="noopener"><span class="dot"></span>Autorizar asesor</a>
  </div>
</body>
</html>
