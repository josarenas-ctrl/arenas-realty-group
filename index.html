<title>Arenas Realty Group</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --sand: #F6EFD9; --sand-deep: #EAD9A0; --clay: #0B2A4A; --clay-soft: #3D6690; --terracotta: #D9A438; --teal: #17A679; --cream: #FBF9F4; --line: rgba(11,42,74,0.15); }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{ background: var(--cream); color: var(--clay); font-family: 'Work Sans', sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1,h2,h3{ font-family: 'Fraunces', serif; font-weight: 500; color: var(--clay); letter-spacing: -0.01em; }
  a{ color: inherit; text-decoration: none; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* Grid de Propiedades Profesional */
  .prop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 30px;
    padding: 20px 0;
  }
  .prop-card {
    border: 1px solid var(--line);
    background: #fff;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .prop-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(11,42,74,0.1); }
  .prop-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
  .prop-card h4 { font-family: 'Fraunces', serif; font-size: 1.2rem; padding: 15px 15px 5px; }
  .prop-card .price { color: var(--terracotta); font-weight: 600; padding: 0 15px 15px; }

  /* Estilos originales preservados */
  nav{ position: sticky; top:0; z-index: 10; background: rgba(243,239,228,0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; padding: 6px 28px; }
  .brand img{ height: 80px; width: auto; }
  nav ul{ display:flex; gap: 32px; list-style:none; }
  
  header.hero{ padding: 110px 0 90px; border-bottom: 1px solid var(--line); }
  h1.headline{ font-size: clamp(2.4rem, 5vw, 3.5rem); margin-bottom: 20px; }
  .btn{ padding: 13px 26px; border-radius: 2px; }
  .btn-primary{ background: var(--clay); color: var(--cream); }
  
  .section{ padding: 80px 0; border-bottom: 1px solid var(--line); }
  .prop-tabs{ display:flex; gap: 32px; margin-bottom: 30px; border-bottom: 1px solid var(--line); }
  .prop-tab{ padding: 10px 0; cursor:pointer; border:none; background:none; font-family: inherit; color: var(--clay-soft); }
  .prop-tab.active{ color: var(--clay); border-bottom: 2px solid var(--terracotta); }
  .prop-panel{ display:none; }
  .prop-panel.active{ display:block; }

  /* Footer y otros */
  footer.contact{ background: var(--clay); color: var(--cream); padding: 60px 0; }
</style>
</head>
