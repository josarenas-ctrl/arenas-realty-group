name: ARI - Scraper de propiedades

# v2.1 (2026-11-01)
# Este workflow SOLO recoge datos crudos de los portales.
# El analisis y ari/data/ultimo-analisis.json los genera unicamente la VPS
# (ari/scripts/run-pipeline.sh), para que nunca haya dos escritores del mismo archivo.
#
# Cambios de v2.1 frente a v2 (la v2 se cancelaba a los 30 min y no guardaba nada):
#   - limite del job: 60 min; limite por scraper: 20 min
#   - MercadoPiso desactivado: las ultimas corridas dieron 0 anuncios (todas las paginas fallaban)
#     y gastaba 12+ min. Para reactivarlo, borrar la linea "if: ${{ false }}" de ese paso.
#   - el paso de commit corre aunque un portal falle (se guardan los datos de los demas);
#     el job queda en rojo para que el fallo se vea. Si el job se cancela, no se commitea nada.
#   - sin "git push --force"; sin disparo por push (evita el ciclo con la VPS)

on:
  schedule:
    # Corre cada 6 horas.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ari-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de ARI
        working-directory: ari
        run: npm install

      - name: Correr scraper de Bienes Online (Miranda, DC, La Guaira)
        timeout-minutes: 20
        working-directory: ari
        run: npm run scrape:bienesonline

      - name: Correr scraper de InmueblesConLupa (agrega RE/MAX, Century21, Rent-A-House)
        timeout-minutes: 20
        working-directory: ari
        run: npm run scrape:inmueblesconlupa

      - name: Correr scraper de ZonaVen (portal directo)
        timeout-minutes: 20
        working-directory: ari
        run: npm run scrape:zonaven

      - name: Correr scraper de MercadoPiso (DESACTIVADO - daba 0 anuncios)
        if: ${{ false }}
        timeout-minutes: 5
        working-directory: ari
        run: npm run scrape:mercadopiso

      - name: Commitear datos crudos (si hay cambios)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "ari-bot"
          git config user.email "ari-bot@users.noreply.github.com"
          git add ari/data
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos - nada que commitear"
            exit 0
          fi
          git commit -m "ARI: actualización de datos scrapeados"
          for intento in 1 2 3; do
            if git push origin HEAD:cloudflare-test; then
              echo "Publicado"
              exit 0
            fi
            echo "Push rechazado (intento $intento); integrando cambios del remoto..."
            git pull --rebase origin cloudflare-test || {
              git rebase --abort 2>/dev/null || true
              echo "Conflicto de rebase. No se fuerza nada: el job falla para que se vea."
              exit 1
            }
          done
          echo "No se pudo publicar tras 3 intentos"
          exit 1
