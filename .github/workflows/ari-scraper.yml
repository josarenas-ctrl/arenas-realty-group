name: ARI - Scraper de propiedades

on:
  schedule:
    # Corre cada 6 horas. Ajustar según se necesite más adelante.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "ari/**"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de ARI
        working-directory: ari
        run: npm install

      - name: Correr scraper de Bienes Online
        working-directory: ari
        run: npm run scrape:bienesonline

      - name: Correr scraper de Mercado Libre (puede quedar vacío por bloqueo)
        working-directory: ari
        run: npm run scrape:mercadolibre
        continue-on-error: true

      - name: Agrupar anuncios duplicados en fichas maestras
        working-directory: ari
        run: npm run dedupe

      - name: Revisar duplicados dudosos con IA
        working-directory: ari
        run: npm run ia-dedupe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true

      - name: Analizar valor y asignar semáforo
        working-directory: ari
        run: npm run analizar

      - name: Commitear datos nuevos (si hay cambios)
        run: |
          git config user.name "ari-bot"
          git config user.email "ari-bot@users.noreply.github.com"
          git add ari/data
          git diff --staged --quiet || git commit -m "ARI: actualización de datos scrapeados"
          git push
