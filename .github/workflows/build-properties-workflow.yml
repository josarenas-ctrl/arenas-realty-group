name: Generar páginas de propiedades

on:
  push:
    branches: [main, cloudflare-test]
    paths:
      - 'propiedades/*.json'
      - 'scripts/*.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-properties-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Generar páginas de propiedades
        run: node scripts/build-properties.js

      - name: Sincronizar catálogo con Crisp (Hugo)
        continue-on-error: true
        env:
          CRISP_WEBSITE_ID: ${{ secrets.CRISP_WEBSITE_ID }}
          CRISP_TOKEN_ID: ${{ secrets.CRISP_TOKEN_ID }}
          CRISP_TOKEN_KEY: ${{ secrets.CRISP_TOKEN_KEY }}
          CRISP_ARTICLE_ID: ${{ secrets.CRISP_ARTICLE_ID }}
        run: node scripts/sync-crisp.js

      - name: Guardar los cambios generados
        run: |
          git config user.name "arenas-bot"
          git config user.email "arenas-bot@users.noreply.github.com"
          git add -A index.html propiedades/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios generados — nada que commitear"
          else
            git commit -m "Actualizar páginas de propiedades automáticamente"
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase falló (conflicto) — force push"
              git rebase --abort 2>/dev/null
              git checkout --theirs index.html propiedades/ sitemap.xml 2>/dev/null
              git add -A index.html propiedades/ sitemap.xml
              git commit --amend --no-edit 2>/dev/null
              GIT_ASKPASS="" GIT_TERMINAL_PROMPT=0 git push --force origin HEAD:${{ github.ref_name }}
              exit 0
            }
            git push
          fi
