name: Generar páginas de propiedades

on:
  push:
    branches: [main, cloudflare-test]
    paths:
      - 'propiedades/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Generar páginas de propiedades
        run: node scripts/build-properties.js

      - name: Guardar los cambios generados
        run: |
          git config user.name "arenas-bot"
          git config user.email "arenas-bot@users.noreply.github.com"
          git add index.html propiedades/*.html sitemap.xml
          git diff --cached --quiet || git commit -m "Actualizar páginas de propiedades automáticamente"
          git push
